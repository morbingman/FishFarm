services:
  postgres:
    image: postgres:17-alpine
    container_name: fishfarm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fishfarm
      POSTGRES_PASSWORD: fishfarm
      POSTGRES_DB: fishfarm
    ports:
      - "5432:5432"
    volumes:
      - fishfarm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishfarm -d fishfarm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fishfarm-pgdata:
