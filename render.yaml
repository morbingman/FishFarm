# Render blueprint — NestJS API + free Postgres.
# Apply from the Render dashboard: New → Blueprint → pick this repo.
# Free-tier caveats: Postgres expires after ~30 days, the service sleeps on
# idle (≈30 s cold start), and the upload disk is ephemeral (redeploys wipe it).
services:
  - type: web
    name: fishfarm-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm i -g pnpm@12 && pnpm install --frozen-lockfile && pnpm prisma:generate && pnpm build && pnpm db:migrate:deploy && pnpm db:seed
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: fishfarm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: "900"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: SESSION_IDLE_MINUTES
        value: "30"
      - key: UPLOAD_MAX_BYTES
        value: "10485760"
      - key: CORS_ORIGINS
        sync: false
      # TEMPORARY — one-time seed deploy; revert after this deploy succeeds.
      - key: ALLOW_DEMO_SEED
        value: "1"

databases:
  - name: fishfarm-db
    databaseName: fishfarm
    plan: free
